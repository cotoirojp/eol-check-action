# The sparse-checkout patterns and the template version are fixed here (part of the pinned code); catalog.json is the pinned file catalog.
name: EOL check
description: 依存関係のファイルと README だけを EOL check に送り、サポート終了などを検査します（ソースコードは送りません）。
inputs:
  app-url:
    description: EOL check の URL（例 https://eolcheck.cotoiro.jp）。https:// で始まる必要があります。
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        filter: blob:none
        fetch-depth: 1
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          **/composer.json
          **/composer.lock
          **/.php-version
          **/.tool-versions
          **/mise.toml
          **/.mise.toml
          **/.wp-env.json
          **/.wp-env.override.json
          **/Dockerfile
          **/Dockerfile.*
          **/*.Dockerfile
          **/*.dockerfile
          **/Containerfile
          **/Containerfile.*
          **/docker-compose*.yml
          **/docker-compose*.yaml
          **/compose.yml
          **/compose.yaml
          **/compose.*.yml
          **/compose.*.yaml
          /.github/workflows/*.yml
          /.github/workflows/*.yaml
          **/.nvmrc
          **/.node-version
          **/package.json
          **/.python-version
          **/runtime.txt
          **/pyproject.toml
          **/go.mod
          **/.ruby-version
          **/Gemfile
          **/Gemfile.lock
          **/wp-includes/version.php
          **/poetry.lock
          **/uv.lock
          **/pdm.lock
          **/Pipfile.lock
          **/Pipfile
          **/requirements*.txt
          **/requirements/*.txt
          **/package-lock.json
          **/npm-shrinkwrap.json
          **/yarn.lock
          **/pnpm-lock.yaml
          **/constraints*.txt
          /[Rr][Ee][Aa][Dd][Mm][Ee]*
          /[Dd][Oo][Cc][Ss]/*.[Mm][Dd]
          /[Dd][Oo][Cc][Ss]/*.[Mm][Aa][Rr][Kk][Dd][Oo][Ww][Nn]
          /[Dd][Oo][Cc][Ss]/*.[Tt][Xx][Tt]
          !**/node_modules/**
          !**/vendor/**
          !**/bower_components/**
          !**/dist/**
          !**/build/**
          !**/.next/**
          !**/.nuxt/**
          !**/.output/**
          !**/.svelte-kit/**
          !**/coverage/**
          !**/.venv/**
          !**/venv/**
          !**/site-packages/**
          !**/__pycache__/**
          !**/.git/**
          !**/.yarn/**
          !**/.pnpm-store/**
          !**/Pods/**
          !**/third_party/**
          !**/[Ss][Tt][Uu][Bb][Ss]/**
          !**/[Ss][Tt][Uu][Bb]/**
          !**/[Bb][Aa][Ss][Ee][Ff][Ii][Ll][Ee][Ss]/**
          !**/[Bb][Aa][Ss][Ee]-[Ff][Ii][Ll][Ee][Ss]/**
          !**/[Bb][Aa][Ss][Ee]_[Ff][Ii][Ll][Ee][Ss]/**
          !**/[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee][Ss]/**
          !**/[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee]/**
          !**/[Ss][Kk][Ee][Ll][Ee][Tt][Oo][Nn]/**
          !**/[Ss][Kk][Ee][Ll][Ee][Tt][Oo][Nn][Ss]/**
          !**/[Ss][Cc][Aa][Ff][Ff][Oo][Ll][Dd]/**
          !**/[Ss][Cc][Aa][Ff][Ff][Oo][Ll][Dd][Ss]/**
          !**/[Ss][Cc][Aa][Ff][Ff][Oo][Ll][Dd][Ii][Nn][Gg]/**
          !**/[Bb][Oo][Ii][Ll][Ee][Rr][Pp][Ll][Aa][Tt][Ee]/**
          !**/[Ee][Xx][Aa][Mm][Pp][Ll][Ee][Ss]/**
          !**/[Ee][Xx][Aa][Mm][Pp][Ll][Ee]/**
          !**/[Ss][Aa][Mm][Pp][Ll][Ee][Ss]/**
          !**/[Ss][Aa][Mm][Pp][Ll][Ee]/**
          !**/[Ff][Ii][Xx][Tt][Uu][Rr][Ee][Ss]/**
          !**/__[Ff][Ii][Xx][Tt][Uu][Rr][Ee][Ss]__/**
          !**/[Tt][Ee][Ss][Tt][Dd][Aa][Tt][Aa]/**
          !**/[Tt][Ee][Ss][Tt]-[Ff][Ii][Xx][Tt][Uu][Rr][Ee][Ss]/**
    - name: Send to EOL check
      shell: bash
      env:
        APP_URL: ${{ inputs.app-url }}
        CLIENT: action
        TEMPLATE_VERSION: '1'
        EOL_CHECK_ACTION_PATH: ${{ github.action_path }}
        CATALOG_FILE: ${{ github.action_path }}/catalog.json
      run: node "$EOL_CHECK_ACTION_PATH/send.mjs"
